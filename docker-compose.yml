# docker-compose.yml — Stack local ERP Django (alcance W16). SOLO DESARROLLO.
# Render NO usa este archivo (usa Dockerfile + variables del dashboard).
# W16: Redis + worker de Celery + Flower. Requiere Docker Desktop; sin él,
#      Django funciona igual en modo EAGER (ver REDIS_URL en .env.example).
# docker-entrypoint.sh ejecuta el `command:` de worker/flower tal cual.
#
# Credenciales locales: se leen de .env; si faltan o están vacías se usan
# los valores por defecto (admin / 12345 / erp_db). Ver .env.example.
services:
  # ── Broker de mensajes Redis ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Base de datos PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:18-alpine            # misma versión mayor que Render
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-erp_db}
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
    volumes:
      # PG 18 guarda los datos en /var/lib/postgresql/18/docker:
      # el volumen se monta en /var/lib/postgresql (no en .../data).
      - postgres18_data:/var/lib/postgresql/
    ports:
      - "127.0.0.1:5432:5432"            # solo accesible desde este equipo
    healthcheck:
      # $$ = se evalúa dentro del contenedor
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Aplicación Django ───────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/app                           # docker-entrypoint.sh debe tener LF
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"                      # Gunicorn escucha en 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # environment: tiene prioridad sobre env_file:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-12345}@db:5432/${POSTGRES_DB:-erp_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_EMBEDDED_WORKER: "0"        # aquí el worker es un servicio aparte

  # ── Worker de Celery — W16 ──────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A core worker -l info -Q erp_django
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-12345}@db:5432/${POSTGRES_DB:-erp_db}
      REDIS_URL: redis://redis:6379/0

  # ── Flower — Monitor de Celery — W16 (http://localhost:5555) ────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A core flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"            # solo accesible desde este equipo
    depends_on:
      - redis
      - celery_worker
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-12345}@db:5432/${POSTGRES_DB:-erp_db}
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres18_data:
  static_volume:
  media_volume:
