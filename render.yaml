# render.yaml — Blueprint de Render (alcance W16: web Docker + PostgreSQL
#                + Key Value/Redis + worker de Celery embebido)
# Documentación: https://render.com/docs/blueprint-spec
#
# W16 — Celery en el plan gratuito:
#   Render NO tiene plan gratuito para Background Workers, así que el
#   worker corre DENTRO del contenedor web (docker-entrypoint.sh lo lanza
#   en segundo plano si CELERY_EMBEDDED_WORKER=1 y existe REDIS_URL).
#   El Key Value (Redis) se crea a mano en el dashboard (plan Free, misma
#   región oregon) y su "Internal Key Value URL" se pega en REDIS_URL.
#
# Fuera de alcance hasta su semana:
#   W17   SendGrid (variables de entorno)
#   W18   Celery Beat (tareas programadas)

services:
  - type: web
    name: erp-django-utec            # debe coincidir con el servicio en Render
    runtime: docker                 # imagen con Pango/Cairo para WeasyPrint
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /              # pública; responde sin login
    # El ENTRYPOINT del Dockerfile migra, recolecta estáticos y arranca
    # Gunicorn en 0.0.0.0:$PORT, así que no hace falta startCommand.
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      # Media en S3 (W11, opcional). Sin bucket se usa el disco efímero.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      # W16: Celery + Redis (Key Value de Render)
      - key: REDIS_URL               # Internal Key Value URL (redis://red-...:6379)
        sync: false
      - key: CELERY_EMBEDDED_WORKER  # 1 = worker dentro del contenedor web
        value: "1"

databases:
  - name: erp-django-db
    plan: free
    region: oregon
    databaseName: erp_db
    user: erp_user
